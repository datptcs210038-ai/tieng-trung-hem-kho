<title>Tiếng Trung Hem Khó — HSK 1–2 Offline (300 từ)</title>
<style>:root{
  --bg:#f8f5ef;--surface:#fffdfa;--surface2:#f2eee7;--ink:#282521;--muted:#756f67;
  --primary:#e96d62;--primary2:#cb4d47;--jade:#4e9f8a;--jade2:#347b6a;--line:#e8e1d8;
  --shadow:0 16px 40px rgba(61,48,39,.08);--radius:24px;--radius-sm:16px;

}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
body.dark{--bg:#161817;--surface:#202321;--surface2:#292d2a;--ink:#f6f2ea;--muted:#b9b2aa;--line:#343a35;--shadow:0 16px 40px rgba(0,0,0,.22)}
button,input,textarea,select{font:inherit}.hanzi{font-family:var(--han)}button{cursor:pointer}
a{color:inherit;text-decoration:none}.hidden{display:none!important}
.shell{min-height:100vh}.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar);padding:24px 18px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);border-right:1px solid var(--line);z-index:30;display:flex;flex-direction:column;gap:20px}
.brand{display:flex;gap:12px;align-items:center;padding:7px 8px}.logo{width:44px;height:44px;border-radius:15px;background:linear-gradient(145deg,var(--primary),#f49c78);display:grid;place-items:center;color:white;font-size:24px;box-shadow:0 10px 25px rgba(233,109,98,.25)}.brand strong{font-size:20px;display:block}.brand small{color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:5px}.nav a{display:flex;gap:12px;align-items:center;padding:11px 13px;border-radius:14px;color:var(--muted);font-weight:650;font-size:14px}.nav a:hover,.nav a.active{background:var(--surface2);color:var(--ink)}.nav a.active{box-shadow:inset 3px 0 var(--primary)}.nav .ico{width:22px;text-align:center;font-size:18px}
.sidebar-foot{margin-top:auto;background:linear-gradient(145deg,color-mix(in srgb,var(--jade) 14%,var(--surface)),var(--surface));padding:14px;border:1px solid var(--line);border-radius:18px}.sidebar-foot b{display:block;margin-bottom:4px}.sidebar-foot small{color:var(--muted);line-height:1.45}
.main{margin-left:var(--sidebar);min-height:100vh}.topbar{position:sticky;top:0;z-index:20;padding:16px 32px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(16px);display:flex;align-items:center;gap:14px;border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.searchbox{flex:1;max-width:620px;position:relative}.searchbox input{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:15px;padding:12px 16px 12px 42px;outline:none}.searchbox input:focus{border-color:color-mix(in srgb,var(--jade) 60%,var(--line));box-shadow:0 0 0 4px color-mix(in srgb,var(--jade) 12%,transparent)}.searchbox span{position:absolute;left:15px;top:11px;color:var(--muted)}
.icon-btn,.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;min-height:42px;padding:0 13px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700}.icon-btn{width:42px;padding:0}.btn.primary{border-color:transparent;background:var(--primary);color:white}.btn.jade{border-color:transparent;background:var(--jade);color:white}.btn.ghost{background:transparent}.btn.sm{min-height:34px;padding:0 10px;font-size:13px}.btn:active{transform:translateY(1px)}
.content{padding:30px 32px 100px;max-width:1450px;margin:auto}.hero{display:grid;grid-template-columns:1.45fr .85fr;gap:22px;margin-bottom:25px}.hero-card{position:relative;overflow:hidden;min-height:270px;padding:34px;border-radius:30px;background:linear-gradient(130deg,#f7b29d,var(--primary) 52%,#d95651);color:white;box-shadow:var(--shadow)}.hero-card:before,.hero-card:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.12)}.hero-card:before{width:220px;height:220px;right:-40px;top:-70px}.hero-card:after{width:160px;height:160px;right:100px;bottom:-95px}.hero-card h1{font-size:clamp(32px,5vw,56px);margin:8px 0 12px;line-height:1.03;max-width:760px}.hero-card p{max-width:650px;line-height:1.65;color:rgba(255,255,255,.9);font-size:16px}.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.hero-actions .btn{border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:white}.hero-actions .btn:first-child{background:white;color:var(--primary2)}
.today-card{padding:24px;background:var(--surface);border:1px solid var(--line);border-radius:30px;box-shadow:var(--shadow)}.today-card h3{margin:0 0 16px}.ring{width:128px;height:128px;margin:16px auto;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--jade) calc(var(--p)*1%),var(--surface2) 0);position:relative}.ring:after{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--surface)}.ring strong{z-index:1;font-size:27px}.ring span{z-index:1;display:block;font-size:11px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0 28px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px}.stat .n{font-size:28px;font-weight:850}.stat .label{font-size:13px;color:var(--muted);margin-top:5px}.stat .spark{height:6px;border-radius:9px;background:var(--surface2);margin-top:12px;overflow:hidden}.stat .spark i{display:block;height:100%;background:var(--primary);border-radius:inherit}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:30px 0 16px}.section-head h2{margin:0;font-size:24px}.section-head p{margin:4px 0 0;color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:0 8px 30px rgba(50,40,30,.04)}.card:hover{border-color:color-mix(in srgb,var(--jade) 30%,var(--line))}.lesson-card{display:flex;flex-direction:column;min-height:190px}.lesson-top{display:flex;justify-content:space-between;align-items:center}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:750;background:var(--surface2);color:var(--muted)}.pill.hsk1{background:#fff0ec;color:#bd5149}.pill.hsk2{background:#e7f5f0;color:#2e7d68}.lesson-card h3{margin:16px 0 6px}.lesson-card p{color:var(--muted);line-height:1.55;font-size:14px}.progressbar{height:8px;background:var(--surface2);border-radius:20px;overflow:hidden;margin-top:auto}.progressbar i{display:block;height:100%;background:linear-gradient(90deg,var(--jade),#73c6ae);border-radius:inherit}
.page-title{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:24px}.page-title h1{margin:0;font-size:34px}.page-title p{margin:8px 0 0;color:var(--muted);line-height:1.6}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.toolbar input,.toolbar select{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:13px;padding:11px 13px;outline:none}.toolbar input{min-width:260px;flex:1}
.vocab-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.word-card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;min-height:210px;display:grid;grid-template-columns:74px 1fr;gap:14px;transition:.18s ease}.word-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--jade) 40%,var(--line))}.illustration{width:74px;height:74px;border-radius:22px;background:linear-gradient(145deg,#fff0e9,#e9f6f1);display:grid;place-items:center;font-size:36px;border:1px solid color-mix(in srgb,var(--line) 80%,transparent);position:relative;overflow:hidden}.illustration:after{content:"";position:absolute;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.45);right:-8px;bottom:-7px}.word-card h3{font-family:var(--han);font-size:28px;margin:0}.pinyin{color:var(--primary2);font-weight:750;margin-top:3px}.meaning{font-weight:730;margin-top:9px}.hanviet{font-size:12px;color:var(--jade2);margin-top:5px}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.meta span{font-size:11px;background:var(--surface2);padding:4px 7px;border-radius:9px;color:var(--muted)}.word-actions{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:11px;margin-top:2px}.word-actions div{display:flex;gap:6px}.mini{border:0;background:var(--surface2);color:var(--muted);width:34px;height:34px;border-radius:11px}.mini.on{background:#ffe8e5;color:var(--primary2)}
.skeleton{background:linear-gradient(90deg,var(--surface2),color-mix(in srgb,var(--surface2) 55%,white),var(--surface2));background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:18px;height:205px}@keyframes shimmer{to{background-position:-200% 0}}
.modal-wrap{position:fixed;inset:0;z-index:80;background:rgba(16,17,16,.42);backdrop-filter:blur(6px);display:grid;place-items:center;padding:18px}.modal{background:var(--surface);border:1px solid var(--line);width:min(760px,100%);max-height:88vh;overflow:auto;border-radius:28px;padding:24px;box-shadow:0 35px 100px rgba(0,0,0,.25)}.modal-head{display:flex;justify-content:space-between;gap:12px}.modal .big-hanzi{font-family:var(--han);font-size:64px;line-height:1}.examples{display:grid;gap:10px;margin-top:16px}.example{padding:14px;border-radius:15px;background:var(--surface2)}.example .zh{font-family:var(--han);font-size:19px;font-weight:700}.example .py{color:var(--primary2);font-size:13px;margin:4px 0}.example .vi{font-size:14px;color:var(--muted)}
.grammar-list{display:grid;gap:14px}.grammar-item{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}.grammar-summary{padding:18px;display:flex;justify-content:space-between;gap:12px;align-items:center;cursor:pointer}.grammar-summary h3{margin:0}.grammar-summary p{margin:4px 0 0;color:var(--muted);font-size:13px}.grammar-body{padding:0 18px 18px;border-top:1px solid var(--line)}.formula{font-family:var(--han);background:#fff3ef;color:#a74640;padding:11px 13px;border-radius:13px;font-weight:750;margin:15px 0}.dark .formula{background:#382522;color:#ffaaa2}.notice{padding:13px 15px;border-radius:14px;background:color-mix(in srgb,var(--jade) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--jade) 28%,var(--line));font-size:13px;color:var(--muted)}
.practice-card{max-width:850px}.target{display:flex;align-items:center;gap:14px;padding:18px;background:linear-gradient(135deg,#fff2ee,#ecf7f3);border-radius:20px;margin:14px 0}.dark .target{background:linear-gradient(135deg,#382724,#21352f)}.target .zh{font-size:42px;font-family:var(--han);font-weight:800}.practice-card textarea{width:100%;min-height:130px;padding:15px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:17px;outline:none;resize:vertical}.checklist{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.checklist span{background:var(--surface2);padding:7px 9px;border-radius:10px;font-size:12px;color:var(--muted)}
.flash-wrap{max-width:700px;margin:24px auto}.flashcard{height:390px;perspective:1000px;cursor:pointer}.flash-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}.flashcard.flipped .flash-inner{transform:rotateY(180deg)}.flash-face{position:absolute;inset:0;backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;box-shadow:var(--shadow);text-align:center}.flash-face.back{transform:rotateY(180deg)}.flash-face .zh{font-family:var(--han);font-size:90px;font-weight:850}.flash-face .py{color:var(--primary2);font-weight:750;font-size:22px}.flash-face .hv{color:var(--jade2);margin-top:7px}.flash-rating{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.flash-rating button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:12px 6px;font-weight:700}.flash-rating small{display:block;color:var(--muted);font-weight:500;margin-top:3px}
.quiz-setup{max-width:760px;margin:18px auto}.quiz-config{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}.quiz-config label{display:block;font-weight:750;margin-bottom:7px}.quiz-config select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink)}
.quiz-progress{max-width:760px;margin:0 auto 14px}.quiz-progress-top{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:13px;margin-bottom:8px}.quiz-question{max-width:760px;margin:0 auto}.quiz-word{text-align:center;padding:24px 16px 18px}.quiz-word .zh{font-family:var(--han);font-size:74px;font-weight:850;line-height:1.05}.quiz-word .py{color:var(--primary2);font-weight:750;font-size:20px;margin-top:8px}
.quiz-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.quiz-option{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:14px;text-align:left;font-weight:700;min-height:58px}.quiz-option:hover:not(:disabled){border-color:var(--jade);transform:translateY(-1px)}.quiz-option:disabled{cursor:default}.quiz-option.correct{background:#e8f7ef;border-color:#55a97f;color:#236a4a}.quiz-option.wrong{background:#fff0ee;border-color:#e47b72;color:#a53f38}.dark .quiz-option.correct{background:#17392b;color:#a8e7c7}.dark .quiz-option.wrong{background:#442522;color:#ffb2aa}
.quiz-feedback{margin-top:14px;padding:14px 16px;border-radius:15px;background:var(--surface2);line-height:1.55}.quiz-feedback.good{border:1px solid color-mix(in srgb,var(--jade) 45%,var(--line))}.quiz-feedback.bad{border:1px solid color-mix(in srgb,var(--primary) 45%,var(--line))}
.quiz-results{max-width:980px;margin:auto}.score-hero{text-align:center;padding:28px}.score-hero .score{font-size:58px;font-weight:900;line-height:1}.result-columns{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.result-list{display:grid;gap:8px}.result-row{display:grid;grid-template-columns:78px 1fr;gap:10px;padding:11px 12px;background:var(--surface2);border-radius:13px}.result-row .zh{font-family:var(--han);font-size:25px;font-weight:800}.result-row small{color:var(--muted)}
.good-ticket{position:relative;overflow:hidden;margin:20px auto;max-width:720px;padding:28px;border:2px dashed #e7a94f;border-radius:26px;background:linear-gradient(135deg,#fff8df,#fff2e7);text-align:center;color:#684917;box-shadow:var(--shadow)}.dark .good-ticket{background:linear-gradient(135deg,#3b321d,#3b2921);color:#ffe6a9}.good-ticket:before,.good-ticket:after{content:"⭐";position:absolute;font-size:44px;opacity:.25}.good-ticket:before{left:22px;top:18px}.good-ticket:after{right:22px;bottom:18px}.good-ticket h2{font-size:32px;margin:8px 0}.good-ticket .seal{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;margin:auto;background:#ffd96c;font-size:42px}
@media(max-width:620px){.quiz-config,.quiz-options,.result-columns{grid-template-columns:1fr}.quiz-word .zh{font-size:60px}}
.chat-fab{position:fixed;right:24px;bottom:24px;z-index:50;width:58px;height:58px;border:0;border-radius:20px;background:var(--primary);color:white;font-size:24px;box-shadow:0 15px 35px rgba(215,78,72,.3)}.chat-pop{position:fixed;right:24px;bottom:92px;width:min(370px,calc(100vw - 28px));height:510px;background:var(--surface);border:1px solid var(--line);border-radius:25px;z-index:60;box-shadow:0 25px 80px rgba(0,0,0,.2);display:flex;flex-direction:column;overflow:hidden}.chat-head{padding:15px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.chat-head small{display:block;color:var(--muted)}.messages{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:9px}.bubble{max-width:82%;padding:10px 12px;border-radius:15px;background:var(--surface2);line-height:1.5;font-size:13px}.bubble.me{margin-left:auto;background:var(--primary);color:white}.chat-input{display:flex;gap:7px;padding:11px;border-top:1px solid var(--line)}.chat-input input{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 12px;border-radius:13px;outline:none}.demo-tag{font-size:10px;color:#a46c18;background:#fff0c9;border-radius:6px;padding:3px 6px;margin-left:6px}.dark .demo-tag{background:#48380d;color:#ffd982}
.inbox{display:grid;grid-template-columns:300px 1fr;height:650px;border:1px solid var(--line);border-radius:25px;overflow:hidden;background:var(--surface)}.conv-list{border-right:1px solid var(--line);overflow:auto}.conv{padding:15px;border-bottom:1px solid var(--line);cursor:pointer}.conv.active,.conv:hover{background:var(--surface2)}.conv b{display:block}.conv small{color:var(--muted)}.thread{display:flex;flex-direction:column}.thread-head{padding:16px;border-bottom:1px solid var(--line)}.thread .messages{padding:20px}.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.setting{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px}.setting h3{margin:0 0 5px}.setting p{margin:0 0 14px;color:var(--muted);font-size:13px}.setting input[type=range]{width:100%}.setting select,.setting input[type=text]{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.empty{text-align:center;padding:55px 20px;color:var(--muted)}.empty .e{font-size:55px}.source-note{margin-top:36px;padding:15px 18px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.6}
.auth-screen{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 10%,#ffe7de 0,transparent 32%),radial-gradient(circle at 85% 85%,#dff3eb 0,transparent 32%),var(--bg)}.auth-card{width:min(480px,100%);background:var(--surface);border:1px solid var(--line);border-radius:30px;padding:28px;box-shadow:var(--shadow)}.auth-brand{text-align:center;margin-bottom:22px}.auth-logo{width:68px;height:68px;margin:auto;border-radius:22px;background:linear-gradient(145deg,var(--primary),#f49c78);display:grid;place-items:center;color:white;font-size:34px}.auth-card h1{margin:12px 0 6px}.auth-card p{color:var(--muted);line-height:1.55}.auth-tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border-radius:14px;padding:4px;margin:18px 0}.auth-tabs button{border:0;background:transparent;padding:10px;border-radius:11px;font-weight:750;color:var(--muted)}.auth-tabs button.active{background:var(--surface);color:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.06)}.auth-field{display:grid;gap:6px;margin:12px 0}.auth-field label{font-size:13px;font-weight:750}.auth-field input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:13px;background:var(--surface);color:var(--ink);outline:none}.auth-error{margin-top:12px;padding:10px 12px;border-radius:12px;background:#fff0ee;color:#a53f38;font-size:13px}.auth-success{margin-top:12px;padding:10px 12px;border-radius:12px;background:#e8f7ef;color:#236a4a;font-size:13px}.user-chip{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line);background:var(--surface);border-radius:14px}.avatar-mini{width:30px;height:30px;border-radius:10px;background:var(--jade);color:white;display:grid;place-items:center;font-weight:850}.leaderboard{width:100%;border-collapse:separate;border-spacing:0 8px}.leaderboard th{text-align:left;color:var(--muted);font-size:12px;padding:0 12px}.leaderboard td{padding:13px 12px;background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.leaderboard td:first-child{border-left:1px solid var(--line);border-radius:14px 0 0 14px}.leaderboard td:last-child{border-right:1px solid var(--line);border-radius:0 14px 14px 0}.rank-medal{font-size:22px}.login-lock{text-align:center;padding:60px 20px}

let musicPlayer=null;
let violinCtx=null, violinTimer=null, violinNodes=[];
function stopAmbient(){
  if(violinTimer){clearTimeout(violinTimer);violinTimer=null;}
  violinNodes.forEach(n=>{try{n.stop?.();n.disconnect?.();}catch{}}); violinNodes=[];
  if(violinCtx){try{violinCtx.close();}catch{} violinCtx=null;}
  musicPlayer=null;
}
function playViolinNote(ctx,freq,start,dur,gain=0.035){
  const osc=ctx.createOscillator(), osc2=ctx.createOscillator(), filter=ctx.createBiquadFilter(), g=ctx.createGain(), vib=ctx.createOscillator(), vibGain=ctx.createGain();
  osc.type='sawtooth'; osc2.type='triangle'; osc.frequency.value=freq; osc2.frequency.value=freq*2;
  filter.type='lowpass'; filter.frequency.value=1550; filter.Q.value=1.3;
  vib.type='sine'; vib.frequency.value=5.1; vibGain.gain.value=2.8; vib.connect(vibGain); vibGain.connect(osc.frequency);
  g.gain.setValueAtTime(0.0001,start); g.gain.exponentialRampToValueAtTime(gain,start+0.12); g.gain.setValueAtTime(gain,start+Math.max(.15,dur-.18)); g.gain.exponentialRampToValueAtTime(0.0001,start+dur);
  osc.connect(filter); osc2.connect(filter); filter.connect(g); g.connect(ctx.destination);
  osc.start(start); osc2.start(start); vib.start(start); osc.stop(start+dur+.03); osc2.stop(start+dur+.03); vib.stop(start+dur+.03); violinNodes.push(osc,osc2,vib);
}
function scheduleViolinLoop(){
  if(!violinCtx)return; const ctx=violinCtx, now=ctx.currentTime+.08;
  const seq=[[392,1],[440,1],[493.88,1],[523.25,2],[493.88,1],[440,1],[392,2],[329.63,1],[392,1],[440,2],[392,1],[349.23,1],[329.63,2],[293.66,1],[329.63,1],[392,2]];
  let t=now; seq.forEach(([f,b])=>{const d=b*.82; playViolinNote(ctx,f,t,d); t+=b*.9;});
  violinTimer=setTimeout(scheduleViolinLoop, Math.max(1000,(t-now-.1)*1000));
}
function startAmbient(){
  stopAmbient(); const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC){toast('Trình duyệt này chưa hỗ trợ nhạc violin nền.');state.settings.music=false;save();return;}
  violinCtx=new AC(); scheduleViolinLoop();
}

function grammarPage(){return `<div class="page-title"><div><h1>Ngữ pháp HSK 1–2</h1><p>Giải thích bằng tiếng Việt, có công thức, ví dụ và lỗi thường gặp.</p></div></div><div class="grammar-list">${GRAMMAR.map((g,i)=>`<div class="grammar-item"><div class="grammar-summary" data-gi="${i}"><div><span class="pill">${esc(g.k)}</span><h3>${esc(g.title)}</h3><p>${esc(g.desc.slice(0,90))}…</p></div><span>⌄</span></div><div class="grammar-body hidden" id="gb-${i}"><div class="formula">${esc(g.formula)}</div><p><b>Khi dùng:</b> ${esc(g.when)}</p><p>${esc(g.desc)}</p><div class="notice">⚠️ <b>Lỗi thường gặp:</b> ${esc(g.mistake)}</div><div class="examples">${g.ex.map(e=>`<div class="example"><div class="zh">${esc(e[0])} <button class="mini speakText" data-text="${esc(e[0])}">🔊</button></div><div class="py">${esc(e[1])}</div><div class="vi">${esc(e[2])}</div></div>`).join('')}</div><button class="btn sm ${state.grammarDone.has(g.k)?'jade':'ghost'} grammarDone" data-key="${esc(g.k)}" style="margin-top:12px">${state.grammarDone.has(g.k)?'✓ Đã học':'Đánh dấu đã học'}</button></div></div>`).join('')}</div>`}

function sentencePage(){const pool=state.words.filter(w=>w.level<=2);const idx=Math.abs(hashCode(localStorage.getItem('hg_target')||new Date().toDateString()))%Math.max(1,pool.length);const w=pool[idx]||state.words[0]||fallbackWords()[0];return `<div class="page-title"><div><h1>Luyện đặt câu</h1><p>Tự viết câu ngắn với từ mục tiêu. Bản miễn phí chỉ đưa gợi ý, <b>không giả vờ chấm bằng AI</b>.</p></div><button class="btn ghost" id="newTarget">Đổi từ ↻</button></div><div class="card practice-card"><div class="target"><div class="illustration">${emojiFor(w)}</div><div><div class="zh">${esc(w.hanzi)}</div><div class="pinyin">${esc(w.pinyin)} · ${esc(w.meaning)}</div><div class="hanviet">Hán-Việt: ${esc(w.hanviet)}</div></div></div><textarea id="sentenceDraft" placeholder="Ví dụ: 我喜欢喝茶。">${esc(state.sentenceDraft)}</textarea><div class="checklist"><span>✓ Có chủ ngữ?</span><span>✓ Trật tự thời gian–địa điểm đúng?</span><span>✓ Từ mục tiêu dùng đúng vị trí?</span><span>✓ Câu đủ ngắn để bạn đọc thành tiếng?</span></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="saveSentence">Lưu nháp</button><button class="btn ghost" id="showSample">Xem câu gợi ý</button><button class="btn ghost speakText" data-text="${esc(w.hanzi)}">🔊 Nghe từ</button></div><div id="sampleBox"></div></div>`}
function hashCode(s){let h=0;for(const c of s)h=((h<<5)-h)+c.charCodeAt(0)|0;return h}


function shuffleArr(arr){
 const a=[...arr];
 for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
 return a;
}
function buildQuiz(level,count){
 let pool=state.words.filter(w=>level? w.level===level:true);
 count=Math.min(count,pool.length);
 const selected=shuffleArr(pool).slice(0,count);
 const items=selected.map(w=>{
   const distractors=shuffleArr(pool.filter(x=>x.hanzi!==w.hanzi&&x.meaning!==w.meaning))
     .map(x=>x.meaning).filter((v,i,a)=>a.indexOf(v)===i).slice(0,3);
   return {word:w,choices:shuffleArr([w.meaning,...distractors]),selected:null,correct:null};
 });
 state.quiz={level,count,items,index:0,finished:false};
}

 return `<div class="page-title"><div><h1>Flashcard trắc nghiệm</h1><p>Chọn đáp án đúng cho từng từ. Kết thúc lượt chơi sẽ có bảng tổng kết từ đúng, từ sai và phần thưởng nếu đạt trên 80%.</p></div></div>
 <div class="card quiz-setup"><h2>🎯 Chọn lượt chơi</h2><p style="color:var(--muted)">Bạn có thể luyện riêng HSK 1, HSK 2 hoặc trộn cả hai.</p>

 <div><label>Số câu</label><select id="quizCount"><option value="10">10 từ — nhanh</option><option value="15">15 từ — vừa</option><option value="20">20 từ — thử thách</option></select></div></div>
 <button class="btn primary" id="startQuiz">Bắt đầu chơi →</button></div>`;
}
function flashcardsPage(){
 const q=state.quiz;
 if(!q)return quizSetupPage();

 const item=q.items[q.index],w=item.word;

 const pct=Math.round(done/q.count*100);
 return `<div class="page-title"><div><h1>Flashcard trắc nghiệm</h1><p>Chọn nghĩa tiếng Việt đúng của từ bên dưới.</p></div><button class="btn ghost" id="quitQuiz">Thoát lượt</button></div>
 <div class="quiz-progress"><div class="quiz-progress-top"><span>Câu <b>${q.index+1}/${q.count}</b></span><span>${q.level?`HSK ${q.level}`:'HSK 1 + 2'}</span></div><div class="progressbar"><i style="width:${pct}%"></i></div></div>
 <div class="card quiz-question"><div class="quiz-word"><div class="illustration" style="width:84px;height:84px;font-size:42px;margin:0 auto 14px">${emojiFor(w)}</div><div class="zh">${esc(w.hanzi)}</div><div class="py">${esc(w.pinyin)}</div><button class="btn sm ghost speakText" data-text="${esc(w.hanzi)}" style="margin-top:12px">🔊 Nghe phát âm</button></div>
 <div class="quiz-options">${item.choices.map((choice,i)=>{
   let cls='';
   if(item.selected!==null){if(choice===w.meaning)cls='correct';else if(choice===item.selected)cls='wrong'}
   return `<button class="quiz-option ${cls}" data-answer="${esc(choice)}" ${item.selected!==null?'disabled':''}><b>${String.fromCharCode(65+i)}.</b> ${esc(choice)}</button>`;
 }).join('')}</div>
 ${item.selected!==null?`<div class="quiz-feedback ${item.correct?'good':'bad'}">${item.correct?'✅ <b>Chính xác!</b>':'❌ <b>Chưa đúng.</b>'} Đáp án đúng là <b>${esc(w.meaning)}</b>.<br><span class="hanviet">Hán-Việt: ${esc(w.hanviet)}</span></div>${q.submitError?`<div class="auth-error">${esc(q.submitError)}</div>`:''}<div style="display:flex;justify-content:flex-end;margin-top:14px"><button class="btn primary" id="nextQuiz" ${q.submitting?'disabled':''}>${q.submitting?'Đang xác minh…':(q.index===q.count-1?'Xác minh & xem kết quả →':'Câu tiếp theo →')}</button></div>`:''}
 </div>`;
}
async function submitQuizResult(){
 const q=state.quiz;if(!q||q.submitting)return;q.submitting=true;render();
 const answers=q.items.map(x=>({hanzi:x.word.hanzi,selected:x.selected}));
 const {data,error}=await db.rpc('submit_quiz_attempt',{p_level:q.level,p_question_count:q.count,p_answers:answers});
 q.submitting=false;
 if(error){q.submitError=error.message;toast('Không lưu được kết quả lên hệ thống');render();return}
 q.serverResult=(data&&data[0])||null;q.finished=true;state.leaderboardLoaded=false;render();
}
function quizResultPage(){
 const q=state.quiz,sr=q.serverResult||{},correct=Number(sr.correct_count??q.items.filter(x=>x.correct).length),wrong=q.count-correct,score=Number(sr.score_percent??Math.round(correct/q.count*100));

 const rows=arr=>arr.length?arr.map(x=>`<div class="result-row"><div class="zh">${esc(x.word.hanzi)}</div><div><b>${esc(x.word.pinyin)}</b><div>${esc(x.word.meaning)}</div>${!x.correct?`<small>Bạn chọn: ${esc(x.selected||'—')}</small>`:''}</div></div>`).join(''):'<div class="empty" style="padding:20px">Không có từ nào 🎉</div>';
 return `<div class="quiz-results"><div class="card score-hero"><span class="pill">HOÀN THÀNH</span><div class="score">${score}%</div><h2>${correct}/${q.count} câu đúng</h2><p style="color:var(--muted)">Đúng: <b>${correct}</b> · Sai: <b>${wrong}</b></p><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn primary" id="restartQuiz">Chơi lượt mới</button><a class="btn jade" href="#/leaderboard">🏆 Xem bảng xếp hạng</a></div></div>
 ${reward?`<div class="good-ticket" id="goodTicket"><div class="seal">🌟</div><h2>PHIẾU BÉ NGOAN</h2><p>Trao tặng <b>${esc(state.settings.name||'Bạn')}</b> vì đã hoàn thành thử thách với <b>${score}%</b> đáp án đúng đã được hệ thống xác minh.</p><div class="pill" style="background:#fff4c1;color:#755719">Tiếng Trung Hem Khó · HSK ${q.level||'1–2'}</div><p style="margin-top:18px"><b>🎁 Nhớ cap màn hình phiếu này lại và gửi vào hệ thống để nhận thưởng nha!</b></p></div>`:`<div class="notice" style="max-width:760px;margin:18px auto">🌱 Bạn cần đạt <b>trên 80%</b> để nhận Phiếu Bé Ngoan. Ôn lại các từ sai bên dưới rồi thử lại nhé!</div>`}

}

 if(state.authLoading){document.getElementById('app').innerHTML='<div class="auth-screen"><div class="card">Đang kiểm tra tài khoản…</div></div>';return}
 if(!state.user){document.getElementById('app').innerHTML=authPage();bindAuth();return}
 document.getElementById('app').innerHTML=shell(routeContent());bind();if(state.currentWord){const w=state.words.find(x=>x.hanzi===state.currentWord);if(w)document.body.insertAdjacentHTML('beforeend',wordModal(w));bindModal();}
}

function bindAuth(){
 const sl=document.getElementById('showLogin');if(sl)sl.onclick=()=>{if(state.authBusy)return;state.authMode='login';state.authMessage='';render()};
 const sr=document.getElementById('showRegister');if(sr)sr.onclick=()=>{if(state.authBusy)return;state.authMode='register';state.authMessage='';render()};
 const resend=document.getElementById('resendConfirm');if(resend)resend.onclick=async()=>{
   const email=document.getElementById('authEmail')?.value.trim();
   if(!email){state.authMessage='❌ Nhập email trước để gửi lại thư xác nhận.';render();return}
   state.authBusy=true;state.authMessage='';render();
   const {error}=await db.auth.resend({type:'signup',email,options:{emailRedirectTo:location.origin+location.pathname}});
   state.authBusy=false;
   state.authMessage=error?'❌ '+error.message:'✅ Đã gửi lại email xác nhận. Kiểm tra Hộp thư đến và Spam.';
   render();
 };
 const form=document.getElementById('authForm');if(form)form.onsubmit=async e=>{
   e.preventDefault();if(state.authBusy)return;
   state.authBusy=true;state.authMessage='';render();
   const email=document.getElementById('authEmail')?.value.trim()||'';const password=document.getElementById('authPassword')?.value||'';
   if(state.authMode==='register'){
     const display_name=document.getElementById('authName')?.value.trim()||'',student_code=document.getElementById('authStudent')?.value.trim()||'';
     const {data,error}=await db.auth.signUp({email,password,options:{data:{display_name,student_code},emailRedirectTo:location.origin+location.pathname}});
     state.authBusy=false;
     if(error){
       const msg=String(error.message||'');
       if(/database error saving new user|already registered|user already registered/i.test(msg)){
         state.authMode='login';
         state.authMessage='✅ Tài khoản với email này đã được tạo. Hãy kiểm tra email xác nhận; nếu chưa thấy, nhập email rồi bấm “Gửi lại email xác nhận”.';
       }else state.authMessage='❌ '+msg;
       render();return
     }
     if(data.session){state.user=data.user;await loadProfile();state.authMessage='';loadData();render()}
     else {state.authMode='login';state.authMessage='✅ Đã tạo tài khoản. Kiểm tra email để xác nhận, sau đó quay lại đăng nhập.';render()}
   }else{
     const {data,error}=await db.auth.signInWithPassword({email,password});
     state.authBusy=false;
     if(error){
       const msg=String(error.message||'');
       state.authMessage=/email not confirmed/i.test(msg)
         ?'❌ Email chưa được xác nhận. Bấm “Gửi lại email xác nhận” nếu bạn chưa nhận được thư.'
         :'❌ Email hoặc mật khẩu chưa đúng.';
       render();return
     }
     state.user=data.user;await loadProfile();state.authMessage='';loadData();render();
   }
 };
}
function bind(){
 const gs=document.getElementById('globalSearch');if(gs)gs.onkeydown=e=>{if(e.key==='Enter'){state.query=e.target.value;location.hash='#/vocab';render()}};
 const tq=document.getElementById('themeQuick');if(tq)tq.onclick=()=>{state.settings.theme=state.settings.theme==='dark'?'light':'dark';save();render()};
 const mq=document.getElementById('musicQuick');if(mq)mq.onclick=()=>{state.settings.music=!state.settings.music;save();syncAmbient();render()};
 const lo=document.getElementById('logoutBtn');if(lo)lo.onclick=async()=>{await db.auth.signOut();state.user=null;state.profile=null;state.quiz=null;state.leaderboardLoaded=false;render()};
 const rb=document.getElementById('refreshBoard');if(rb)rb.onclick=()=>{state.leaderboardLoaded=true;loadLeaderboard()};
 const vf=document.getElementById('vocabSearch');if(vf)vf.oninput=e=>{state.query=e.target.value;render()};
 const lf=document.getElementById('levelFilter');if(lf)lf.onchange=e=>{state.filterLevel=Number(e.target.value);location.hash='#/vocab';render()};
 const cf=document.getElementById('catFilter');if(cf)cf.onchange=e=>{state.filterCategory=e.target.value;render()};
 document.querySelectorAll('.detailWord').forEach(b=>b.onclick=e=>{state.currentWord=e.currentTarget.dataset.word;render()});
 document.querySelectorAll('.speakWord').forEach(b=>b.onclick=e=>{e.stopPropagation();speak(e.currentTarget.dataset.word)});
 document.querySelectorAll('.speakText').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();speak(e.currentTarget.dataset.text)});
 document.querySelectorAll('.favWord').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();const w=e.currentTarget.dataset.word;state.favorites.has(w)?state.favorites.delete(w):state.favorites.add(w);save();render()});
 document.querySelectorAll('.learnWord').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();const w=e.currentTarget.dataset.word;state.learned.has(w)?state.learned.delete(w):state.learned.add(w);save();render()});
 document.querySelectorAll('.grammar-summary').forEach(b=>b.onclick=()=>document.getElementById('gb-'+b.dataset.gi)?.classList.toggle('hidden'));
 document.querySelectorAll('.grammarDone').forEach(b=>b.onclick=()=>{const k=b.dataset.key;state.grammarDone.has(k)?state.grammarDone.delete(k):state.grammarDone.add(k);save();render()});
 const tl=document.getElementById('toggleLesson');if(tl)tl.onclick=()=>{const p=currentPath().slice(2).split('/');const id=`${p[1]}:${decodeURIComponent(p.slice(2).join('/'))}`;state.completedLessons.has(id)?state.completedLessons.delete(id):state.completedLessons.add(id);save();render()};
 const nt=document.getElementById('newTarget');if(nt)nt.onclick=()=>{localStorage.setItem('hg_target',Date.now().toString());render()};
 const sd=document.getElementById('sentenceDraft');if(sd)sd.oninput=e=>state.sentenceDraft=e.target.value;
 const ss=document.getElementById('saveSentence');if(ss)ss.onclick=()=>{save();toast('Đã lưu nháp trên thiết bị ✓')};
 const sb=document.getElementById('showSample');if(sb)sb.onclick=()=>{const pool=state.words;const idx=Math.abs(hashCode(localStorage.getItem('hg_target')||new Date().toDateString()))%Math.max(1,pool.length);const w=pool[idx];const ex=examplesFor(w)[0];document.getElementById('sampleBox').innerHTML=`<div class="example" style="margin-top:14px"><div class="zh">${esc(ex[0])}</div><div class="py">${esc(ex[1])}</div><div class="vi">${esc(ex[2])}</div></div>`};
 const sq=document.getElementById('startQuiz');if(sq)sq.onclick=()=>{const level=Number(document.getElementById('quizLevel').value),count=Number(document.getElementById('quizCount').value);buildQuiz(level,count);render()};
 document.querySelectorAll('.quiz-option').forEach(b=>b.onclick=()=>{const q=state.quiz;if(!q||q.finished)return;const item=q.items[q.index];if(item.selected!==null)return;item.selected=b.dataset.answer;item.correct=item.selected===item.word.meaning;if(item.correct)state.learned.add(item.word.hanzi);else state.reviews[item.word.hanzi]='again';save();render()});
 const nq=document.getElementById('nextQuiz');if(nq)nq.onclick=async()=>{const q=state.quiz;if(!q)return;if(q.index>=q.count-1){await submitQuizResult()}else{q.index++;render()}};
 const rq=document.getElementById('restartQuiz');if(rq)rq.onclick=()=>{state.quiz=null;render()};
 const qq=document.getElementById('quitQuiz');if(qq)qq.onclick=()=>{if(confirm('Thoát lượt chơi hiện tại?')){state.quiz=null;render()}};
 bindSettings();bindChat();
}

function bindSettings(){
 const n=document.getElementById('setName');if(n)n.onchange=e=>{state.settings.name=e.target.value;save()};
 const g=document.getElementById('setGoal');if(g)g.onchange=e=>{state.settings.goal=e.target.value;save()};
 const v=document.getElementById('setVoice');if(v)v.onchange=e=>{state.settings.voice=e.target.value;save()};
 const r=document.getElementById('setRate');if(r)r.oninput=e=>{state.settings.rate=Number(e.target.value);document.getElementById('rateLabel').textContent=state.settings.rate+'x';save()};
 const tv=document.getElementById('testVoice');if(tv)tv.onclick=()=>speak('你好，欢迎学习中文。');
 const m=document.getElementById('setMusic');if(m)m.onchange=e=>{state.settings.music=e.target.checked;save();syncAmbient()};
 const vol=document.getElementById('setVolume');if(vol)vol.oninput=e=>{state.settings.volume=Number(e.target.value);save();if(state.settings.music)startAmbient()};
 const th=document.getElementById('toggleTheme');if(th)th.onclick=()=>{state.settings.theme=state.settings.theme==='dark'?'light':'dark';save();render()};
 const rp=document.getElementById('resetProgress');if(rp)rp.onclick=()=>{if(confirm('Xóa tiến độ học trên thiết bị này?')){state.learned.clear();state.favorites.clear();state.reviews={};state.completedLessons.clear();state.grammarDone.clear();save();render();toast('Đã xóa tiến độ')}};
}

function bindChat(){
 const fab=document.getElementById('chatFab');if(fab)fab.onclick=()=>{state.chatOpen=!state.chatOpen;render()};
 const cl=document.getElementById('chatClose');if(cl)cl.onclick=()=>{state.chatOpen=false;render()};
 const form=document.getElementById('chatForm');if(form)form.onsubmit=e=>{e.preventDefault();const inp=document.getElementById('chatText');if(!inp.value.trim())return;state.chat.push({from:'me',text:inp.value.trim()});state.chat.push({from:'staff',text:'Tin nhắn đã được lưu trong bản demo trên thiết bị. Backend nhân viên thật chưa được kết nối.'});save();render();setTimeout(()=>{const m=document.getElementById('chatMsgs');if(m)m.scrollTop=m.scrollHeight},0)};
}

function bindModal(){const c=document.getElementById('closeModal');if(c)c.onclick=()=>{state.currentWord=null;document.getElementById('modalWrap')?.remove()};const mw=document.getElementById('modalWrap');if(mw)mw.onclick=e=>{if(e.target===mw){state.currentWord=null;mw.remove()}};document.querySelectorAll('#modalWrap .speakText').forEach(b=>b.onclick=e=>{e.stopPropagation();speak(b.dataset.text)});document.querySelectorAll('#modalWrap .favWord').forEach(b=>b.onclick=e=>{e.stopPropagation();const w=b.dataset.word;state.favorites.has(w)?state.favorites.delete(w):state.favorites.add(w);save();toast('Đã cập nhật danh sách lưu')});document.querySelectorAll('#modalWrap .learnWord').forEach(b=>b.onclick=e=>{e.stopPropagation();const w=b.dataset.word;state.learned.has(w)?state.learned.delete(w):state.learned.add(w);save();toast('Đã cập nhật tiến độ')})}

window.addEventListener('hashchange',()=>{state.currentWord=null;render()});
window.addEventListener('beforeunload',save);
async function boot(){
 const {data:{session}}=await db.auth.getSession();
 state.user=session?.user||null;
 if(state.user)await loadProfile();
 state.authLoading=false;
 if(state.user)await loadData(); else render();
 db.auth.onAuthStateChange(async(event,session)=>{
   state.user=session?.user||null;
   if(state.user){await loadProfile();if(!state.words.length)await loadData();else render()}
   else{state.profile=null;state.quiz=null;render()}
 });
}
boot();
</script>
</body>
